name: Panel or manager bug
description: The panel, the manager, the GPU clock tab or the patch download misbehaves.
title: "[Manager] <symptom>"
labels: ["manager"]
body:
  - type: input
    id: setup
    attributes:
      label: Setup
      description: NeoEnabler version, PS5 firmware, jailbreak and loader.
      placeholder: v0.3.1, FW 13.20, y2jb + etaHEN
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: What happens and how to reproduce
      description: Steps from console boot, and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: '"Save Logs" in the panel, or the sender output.'
      render: text
    validations:
      required: true
