name: Game problem
description: A supported game crashes, shows a bad image or does not start in PS4 Pro mode.
title: "[Game] <title ID> <symptom>"
labels: ["game-problem"]
body:
  - type: markdown
    attributes:
      value: Only the games and versions in the README have patches. Load ps-patch-system before NeoEnabler.
  - type: input
    id: game
    attributes:
      label: Game, title ID and version
      placeholder: Bloodborne, CUSA00900, 01.09
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: NeoEnabler version, PS5 firmware, console model, jailbreak and loader.
      placeholder: v0.3.2, FW 13.20, Slim, y2jb + etaHEN
    validations:
      required: true
  - type: textarea
    id: patches
    attributes:
      label: Enabled patches
      description: Everything ticked for this game in the panel.
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What happens
      description: When it happens, and whether the console recovers or freezes.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Click "Download Logs" in the panel, then drag the file neo-logs.txt into this box.'
    validations:
      required: true
