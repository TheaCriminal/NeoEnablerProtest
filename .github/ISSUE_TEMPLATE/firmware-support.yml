name: Firmware test or support
description: A result on a firmware other than 13.20, or a request for a new firmware.
title: "[Firmware] <version> <result>"
labels: ["firmware"]
body:
  - type: markdown
    attributes:
      value: See `diagnostics/README.md` to collect the data. Firmware 14.00 and later cannot be supported.
  - type: input
    id: setup
    attributes:
      label: Setup
      description: PS5 firmware, console model, jailbreak and loader, hypervisor exploit (yes or no), NeoEnabler version.
      placeholder: FW 13.60, Fat, Byepervisor + etaHEN, v0.3.0
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What you tested (game, patch, 8 GiB) and what happened, with exact error text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: '"Save Logs" in the panel. Attach `diagnostic.jsonl` as a file. Never attach kernel dumps.'
      render: text
    validations:
      required: true
