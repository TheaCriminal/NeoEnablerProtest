name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_VERSION: v0.44

jobs:
  analyze:
    name: CodeQL (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools and the PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 xxd unzip python3
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build the payload
        run: PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk" bash build.sh

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
