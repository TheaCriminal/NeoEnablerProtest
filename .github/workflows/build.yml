name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # PS5 Payload SDK release used for the build (https://github.com/ps5-payload-dev/sdk/releases)
  SDK_VERSION: v0.44

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 xxd unzip python3

      - name: Cache PS5 Payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ps5-payload-sdk
          key: ps5-payload-sdk-${{ env.SDK_VERSION }}

      - name: Install PS5 Payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^#define VERSION "NEO Enabler manager \(.*\)"$/\1/p' src/manager.c)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in src/manager.c"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## ${GITHUB_REF_NAME#v}\" section describing the release"
            exit 1
          fi

      - name: Build
        run: PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk" bash build.sh

      - name: Checksum
        run: cd build && sha256sum neo-manager.elf > neo-manager.elf.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: neo-manager
          path: |
            build/neo-manager.elf
            build/neo-manager.elf.sha256
            build/release-notes.md
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neo-manager

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" neo-manager.elf neo-manager.elf.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NEO Enabler ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
