name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests (${{ matrix.cc }}${{ matrix.sanitize == '1' && ', ASan+UBSan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (budget guards, memory control, rollback)
        env:
          CC: ${{ matrix.cc }}
        run: |
          flags="-O2 -Wall -Wextra -Werror"
          if [ "${{ matrix.sanitize }}" = "1" ]; then
            flags="$flags -fsanitize=address,undefined -fno-sanitize-recover=all"
          fi
          $CC $flags tests/budget_test.c -o /tmp/neo-budget-test
          /tmp/neo-budget-test
      - name: Unit tests (XML merge, game patches and settings, patch sync against a fake GitHub serving xml/, ATTRIBUTE offset)
        env:
          CC: ${{ matrix.cc }}
        run: |
          flags="-O2 -Wall -Wextra -Werror"
          if [ "${{ matrix.sanitize }}" = "1" ]; then
            flags="$flags -fsanitize=address,undefined -fno-sanitize-recover=all"
          fi
          $CC $flags tests/xml_merge_test.c -o /tmp/neo-xml-merge-test
          /tmp/neo-xml-merge-test
          $CC $flags tests/game_patches_test.c -o /tmp/neo-game-patches-test
          /tmp/neo-game-patches-test
          $CC $flags tests/patch_sync_test.c -o /tmp/neo-patch-sync-test
          /tmp/neo-patch-sync-test xml
          $CC $flags tests/log_mirror_test.c -o /tmp/neo-log-mirror-test
          /tmp/neo-log-mirror-test
          $CC $flags tests/games_8gib_test.c -o /tmp/neo-games-8gib-test
          /tmp/neo-games-8gib-test xml
          $CC $flags tests/attr_detect_test.c -o /tmp/neo-attr-detect-test
          /tmp/neo-attr-detect-test

  patch-sync-github:
    name: Patch sync with the GitHub download
    # The payload downloads from gasb07/NeoEnabler, so forks cannot run this against their own copy.
    if: github.repository == 'gasb07/NeoEnabler'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download xml/ the way the payload does (API listing, then each download_url)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p /tmp/gh/dl
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/gasb07/NeoEnabler/contents/xml?ref=${REF}" -o /tmp/gh/listing.json
          python3 -c 'import json, sys; print("\n".join(e["download_url"] for e in json.load(open(sys.argv[1])) if e["name"].endswith(".xml")))' \
            /tmp/gh/listing.json > /tmp/gh/urls
          (cd /tmp/gh/dl && xargs -n1 curl -fsSLO < /tmp/gh/urls)
      - name: Downloaded files match xml/
        run: diff -r xml /tmp/gh/dl -x '*.md'
      - name: Sync with the real listing and downloaded files
        run: |
          cc -O2 -Wall -Wextra -Werror tests/patch_sync_test.c -o /tmp/neo-patch-sync-test
          /tmp/neo-patch-sync-test /tmp/gh/dl /tmp/gh/listing.json

  diagnostic-toolkit:
    name: Diagnostic toolkit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Firmware report tests
        run: python3 -m unittest discover -s tests -p 'test_firmware_report.py' -v

  static:
    name: Static and security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --inline-suppr --error-exitcode=1 --std=c11 \
            --suppress=missingIncludeSystem -I src src diagnostics
      - name: shellcheck
        run: shellcheck --severity=warning build.sh diagnostics/build.sh
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
